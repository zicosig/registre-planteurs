name: Construire l'APK

on:
  workflow_dispatch:
    inputs:
      variante:
        description: "debug (test rapide) ou release (signé, à distribuer)"
        required: true
        default: release
        type: choice
        options: [debug, release]
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dépendances
        run: npm install

      - name: Générer le projet Android
        run: |
          npx cap add android || npx cap sync android
          node scripts/harden.js

      - name: Restaurer la clé de signature
        if: ${{ github.event.inputs.variante != 'debug' }}
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/cle.jks"

      - name: Compiler
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/cle.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ github.event.inputs.variante }}" = "debug" ]; then
            ./gradlew assembleDebug
          else
            ./gradlew assembleRelease
          fi

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: registre-planteurs-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
